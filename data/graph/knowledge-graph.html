<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识图谱 · Operit-wiki 知识图谱</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f7f1e5;
      --panel: rgba(255, 252, 244, .86);
      --ink: #2f2924;
      --muted: #766b5f;
      --rule: rgba(79, 64, 46, .2);
      --accent: #a83f35;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      color: var(--ink);
      background: var(--page-bg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .offline-shell {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      min-height: 100vh;
    }
    .offline-header {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--rule);
      background: var(--panel);
      backdrop-filter: blur(10px);
    }
    .offline-title { min-width: 0; }
    .offline-title h1 {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      letter-spacing: 0;
    }
    .offline-title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    .offline-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 12px;
    }
    .offline-badges span {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 9px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: rgba(255, 255, 255, .46);
    }
    .offline-theme-toggle {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: rgba(255, 255, 255, .52);
      color: var(--ink);
      padding: 4px 10px;
      font: inherit;
      cursor: pointer;
    }
    .offline-theme-toggle:hover {
      background: rgba(168, 63, 53, .08);
    }
    .offline-toolbar-host {
      position: relative;
      z-index: 5;
      flex: 1 1 320px;
      min-width: 240px;
      min-height: 38px;
    }
    .offline-toolbar-host .graph-toolbar {
      position: static;
      inset: auto;
      justify-items: center;
    }
    .offline-toolbar-host .graph-toolbar-panel {
      position: absolute;
      top: 38px;
      left: 50%;
      transform: translateX(-50%);
    }
    .offline-main {
      position: relative;
      z-index: 1;
      grid-row: 3;
      min-height: 0;
      padding: 0;
    }
    #graph-root {
      width: 100%;
      height: 100%;
      min-height: 560px;
    }
    .offline-error {
      margin: 24px;
      padding: 16px;
      border: 1px solid rgba(168, 63, 53, .35);
      border-radius: 8px;
      background: rgba(168, 63, 53, .08);
      color: #7b2b24;
      font-size: 14px;
      line-height: 1.6;
    }
    .offline-storage-warning {
      margin: 12px 18px 0;
    }
    .offline-warning-banner {
      position: relative;
      z-index: 15;
      margin: 10px 18px 0;
      padding: 12px 14px;
      border: 1px solid rgba(168, 63, 53, .3);
      border-radius: 10px;
      background: rgba(255, 249, 237, .94);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.55;
    }
    .offline-warning-banner[hidden] { display: none; }
    .offline-warning-summary { font-weight: 650; }
    .offline-warning-notice { margin-top: 6px; color: #7b2b24; }
    .offline-warning-details { margin-top: 8px; }
    .offline-warning-details > summary { cursor: pointer; color: var(--accent); }
    .offline-warning-group { margin: 10px 0 0 14px; }
    .offline-warning-group h3 { margin: 0; font-size: 13px; }
    .offline-warning-group ul { margin: 4px 0 0; padding-left: 20px; }
    @media (max-width: 720px) {
      .offline-header { align-items: flex-start; flex-direction: column; }
      .offline-toolbar-host { width: 100%; flex-basis: auto; }
      .offline-toolbar-host .graph-toolbar { justify-items: start; }
      .offline-toolbar-host .graph-toolbar-panel { left: 0; transform: none; }
      .offline-badges { justify-content: flex-start; }
      #graph-root { min-height: 520px; }
    }
  </style>
</head>

        <button class="offline-theme-toggle" type="button" data-testid="offline-theme-toggle" aria-label="切换墨夜主题">墨夜</button>
      </div>
    </header>
    <section class="offline-warning-banner" data-testid="offline-warning-banner" aria-label="图谱告警" hidden>
      <div class="offline-warning-summary" data-testid="offline-warning-summary"></div>
      <div class="offline-warning-notice" data-testid="offline-warning-unavailable" hidden></div>

      </details>

    <main class="offline-main">

.llm-wiki-graph-engine {
  position: relative;
  width: 100%;
  min-height: 520px;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: contain;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
  color: var(--ink);
  font-family: var(--font-ui);
  background:
    var(--paper-glow, radial-gradient(ellipse at 28% 55%, color-mix(in srgb, var(--surface) 56%, transparent), transparent 56%)),
    var(--paper-vignette, radial-gradient(ellipse at 70% 48%, color-mix(in srgb, var(--mist) 60%, transparent), transparent 58%)),
    var(--paper-mottle, none),
    var(--bg);
}
.llm-wiki-graph-engine[data-theme="mo-ye"] {
  background:
    var(--paper-glow, radial-gradient(140% 95% at 50% -25%, color-mix(in srgb, var(--surface-2) 38%, transparent), transparent 55%)),
    linear-gradient(180deg, color-mix(in srgb, var(--surface-2) 38%, transparent), transparent 34%),
    radial-gradient(ellipse at 28% 56%, color-mix(in srgb, var(--night) 13%, transparent), transparent 58%),
    radial-gradient(ellipse at 76% 38%, color-mix(in srgb, var(--cinnabar) 9%, transparent), transparent 54%),
    var(--paper-vignette, radial-gradient(ellipse 105% 92% at 50% 40%, transparent 52%, rgba(0, 0, 0, .22) 100%)),
    var(--paper-mottle, none),
    var(--bg);
}
[data-llm-wiki-graph-route-transition] > .sigma-global-route,
[data-llm-wiki-graph-route-transition] > [data-llm-wiki-graph-root="true"],
[data-llm-wiki-graph-route-transition] > .graph-over-limit-notice-view {
  animation: graph-route-continuity .16s ease-out both;
}
@media (prefers-reduced-motion: reduce) {
  [data-llm-wiki-graph-route-transition] > .sigma-global-route,
  [data-llm-wiki-graph-route-transition] > [data-llm-wiki-graph-root="true"],
  [data-llm-wiki-graph-route-transition] > .graph-over-limit-notice-view {
    animation: none;
  }
}
@keyframes graph-route-continuity {
  from {
    opacity: .82;
    transform: scale(.996);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
.sigma-global-route,
.sigma-global-renderer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.sigma-global-route.llm-wiki-graph-engine {
  min-height: 0;
}
.sigma-global-renderer canvas {
  position: absolute;
  inset: 0;
}
.sigma-global-overlay {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
}
.sigma-global-node-hit-target,
.sigma-global-community-region,
.sigma-global-community-label {
  position: absolute;
  pointer-events: none;
}
.sigma-global-node-hit-target {
  border: 1px solid currentColor;
  cursor: pointer;
  pointer-events: auto;
  z-index: 2;
  border-radius: 999px;
  opacity: 0;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
}
.sigma-global-node-hit-target:focus-visible {
  outline: 2px solid var(--cinnabar);
  outline-offset: 2px;
  opacity: .2;
}
.sigma-global-community-label {
  max-width: 160px;
  overflow: hidden;
  transform: translate(-50%, -50%);
  border-radius: 4px;
  background: color-mix(in srgb, var(--surface) 58%, transparent);
  box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 10%, transparent);
  padding: 1px 5px;
  color: var(--muted);
  font: 600 12px/1.35 var(--font-ui);
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sigma-global-community-label[data-selected="true"] {
  background: color-mix(in srgb, var(--surface) 72%, transparent);
  color: var(--ink);
  font-weight: 600;
}
.sigma-global-community-label[data-dim="true"] {
  opacity: .45;
}
.graph-content-layer {
  position: absolute;
  inset: 0;
  z-index: 2;
  transform-origin: 0 0;
  will-change: transform;
}
.graph-search {
  position: absolute;
  top: 64px;
  left: 14px;
  z-index: 7;
  display: grid;
  grid-template-columns: minmax(180px, 260px) auto;
  align-items: center;
  gap: 8px;
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
  transition: opacity .16s ease, transform .16s ease;
}
.graph-search[data-state="open"],
.graph-search:focus-within {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}
.graph-search-input {
  touch-action: auto;
  user-select: text;
  -webkit-user-select: text;
  min-width: 0;
  border: 1px solid color-mix(in srgb, var(--rule) 78%, transparent);
  border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  padding: 8px 10px;
  color: var(--ink);
  font: 13px/1.3 var(--font-ui);
  outline: none;
  box-shadow: 0 12px 24px rgba(36, 24, 12, .08);
}
.llm-wiki-graph-engine[data-theme="mo-ye"] .graph-search-input {
  background: color-mix(in srgb, var(--surface) 88%, transparent);
}
.graph-search-input:focus {
  border-color: color-mix(in srgb, var(--cinnabar) 70%, transparent);
}
.graph-search-status {
  border: 1px solid color-mix(in srgb, var(--rule) 68%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 84%, transparent);
  padding: 5px 8px;
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
}
.graph-search-results-list {
  grid-column: 1 / -1;
  display: none;
  max-height: 240px;
  overflow: auto;
  border: 1px solid color-mix(in srgb, var(--rule) 72%, transparent);
  border-radius: 12px;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  box-shadow: 0 16px 32px rgba(36, 24, 12, .12);
  padding: 4px;
}
.graph-search[data-state="open"] .graph-search-results-list[data-state="visible"],
.graph-search:focus-within .graph-search-results-list[data-state="visible"] {
  display: grid;
  gap: 2px;
}
.graph-search-result-item {
  width: 100%;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 7px 8px;
  text-align: left;
  font: inherit;
}
.graph-search-result-item:hover,
.graph-search-result-item:focus-visible,
.graph-search-result-item[aria-selected="true"] {
  outline: none;
  background: color-mix(in srgb, var(--cinnabar) 14%, transparent);
}
.graph-search-result-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.graph-search-result-meta {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0;
  text-transform: uppercase;
}
.sigma-community-hidden-node-hint {
  position: absolute;
  left: 50%;
  top: 74px;
  z-index: 6;
  display: none;
  translate: -50% 0;
  max-width: min(420px, calc(100% - 32px));
  padding: 7px 11px;
  border: 1px solid color-mix(in srgb, var(--cinnabar) 55%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  box-shadow: 0 10px 28px rgba(36, 24, 12, .14);
  color: var(--ink);
  font-size: 12px;
  font-weight: 650;
  line-height: 1.35;
  pointer-events: none;
}
.llm-wiki-graph-engine[data-hidden-reading-node="true"] .sigma-community-hidden-node-hint {
  display: block;
}
.graph-toolbar {
  position: absolute;
  top: 14px;
  left: 14px;
  right: 14px;
  z-index: 8;
  display: grid;
  justify-items: start;
  pointer-events: none;
}
.graph-toolbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  border: 1px solid color-mix(in srgb, var(--rule) 62%, transparent);
  border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 64%, transparent);
  box-shadow: 0 14px 30px rgba(36, 24, 12, .08);
  backdrop-filter: blur(14px);
  padding: 4px;
  pointer-events: auto;
}
.llm-wiki-graph-engine[data-theme="mo-ye"] .graph-toolbar-actions {
  background: color-mix(in srgb, var(--surface) 58%, transparent);
}
.graph-toolbar-button {
  user-select: none;
  -webkit-user-select: none;
  min-height: 28px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font: 12px/1.2 var(--font-ui);
  padding: 0 10px;
  cursor: pointer;
  white-space: nowrap;
}
.graph-toolbar-button:hover,
.graph-toolbar-button[data-active="true"] {
  background: color-mix(in srgb, var(--cinnabar) 10%, transparent);
  color: var(--ink);
}
.graph-toolbar-panel {
  width: min(320px, calc(100vw - 28px));
  max-height: min(58vh, 420px);
  margin-top: 8px;
  border: 1px solid color-mix(in srgb, var(--rule) 62%, transparent);
  border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  box-shadow: 0 20px 42px rgba(36, 24, 12, .12);
  backdrop-filter: blur(16px);
  overflow: auto;
  pointer-events: auto;
}
.llm-wiki-graph-engine[data-theme="mo-ye"] .graph-toolbar-panel {
  background: color-mix(in srgb, var(--surface) 62%, transparent);
}
.graph-toolbar-panel[data-state="closed"] {
  display: none;
}
.graph-zoom-controls {
  position: absolute;
  left: 14px;
  bottom: 14px;
  z-index: 8;
  display: inline-flex;
  flex-direction: column;
  gap: 5px;
  border: 1px solid color-mix(in srgb, var(--rule) 62%, transparent);
  border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 64%, transparent);
  box-shadow: 0 14px 30px rgba(36, 24, 12, .08);
  backdrop-filter: blur(14px);
  padding: 4px;
  pointer-events: auto;
}
.llm-wiki-graph-engine[data-theme="mo-ye"] .graph-zoom-controls {
  background: color-mix(in srgb, var(--surface) 58%, transparent);
}
.graph-zoom-button {
  user-select: none;
  -webkit-user-select: none;
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font: 600 18px/1 var(--font-ui);
  cursor: pointer;
}
.graph-zoom-button:hover,
.graph-zoom-button:focus-visible {
  background: color-mix(in srgb, var(--cinnabar) 10%, transparent);
  color: var(--ink);
  outline: none;
}
.graph-toolbar-section {
  display: none;
}
.graph-toolbar-panel[data-state="filters"] .graph-toolbar-filters,
.graph-toolbar-panel[data-state="legend"] .graph-toolbar-legend {
  display: block;
}
.graph-toolbar-section-title {
  padding: 10px 12px;
  color: var(--muted);
  font: 12px/1.3 var(--font-ui);
}
.graph-type-filter {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  margin: 0;
  border: 0;
  border-bottom: 1px solid color-mix(in srgb, var(--rule) 52%, transparent);
  padding: 0 10px 10px;
}
.graph-type-filter .graph-toolbar-section-title {
  grid-column: 1 / -1;
  padding: 10px 2px 2px;
}
.graph-type-filter-option {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  min-height: 28px;
  border: 1px solid color-mix(in srgb, var(--rule) 52%, transparent);
  border-radius: 6px;
  background: color-mix(in srgb, var(--surface) 48%, transparent);
  padding: 0 8px;
  color: var(--ink);
  font: 12px/1.2 var(--font-ui);

.node.is-compact {

  max-width: 130px;
  padding: 6px 9px;

}
.node.is-compact .node-kind,
.node.is-compact .node-meta { display: none; }
.node.is-compact .node-name {
  max-width: 104px;
  font-size: 12px;
}
.node.is-point,
.node.is-overview,
.node[data-visual-role="map-pin"] {

  height: 14px;
  min-width: 14px;
  min-height: 14px;
  max-width: 14px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: var(--night);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--night) 14%, transparent);
}
.node.is-point[data-type="topic"],
.node.is-overview[data-type="topic"] { background: var(--cinnabar); }
.node.is-point[data-type="source"],
.node.is-overview[data-type="source"] { background: var(--jade); }
.node.is-point .node-kind,
.node.is-point .node-name,
.node.is-point .node-meta,
.node.is-overview .node-kind,
.node.is-overview .node-name,
.node.is-overview .node-meta { display: none; }
.node.is-label-hidden .node-name { display: none; }
.node[data-visual-role="landmark"] {
  min-height: 30px;
  max-width: 150px;
  padding: 5px 10px 5px 24px;
  border: 1px solid color-mix(in srgb, var(--rule) 78%, transparent);
  border-radius: 999px 8px 8px 999px;
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  box-shadow: 0 8px 16px rgba(36, 31, 26, .06);
}
.llm-wiki-graph-engine[data-theme="mo-ye"] .node[data-visual-role="landmark"] {
  border-color: color-mix(in srgb, var(--line) 38%, transparent);
  background: color-mix(in srgb, var(--surface) 64%, transparent);
  box-shadow: 0 10px 20px rgba(0, 0, 0, .22);
}
.node[data-visual-role="landmark"]::before {
  inset: auto auto auto 9px;
  top: 50%;
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--night);
  opacity: .78;
  translate: 0 -50%;
}
.node[data-visual-role="landmark"][data-type="topic"]::before { background: var(--cinnabar); }
.node[data-visual-role="landmark"][data-type="source"]::before { background: var(--jade); }
.node[data-visual-role="landmark"] .node-kind,
.node[data-visual-role="landmark"] .node-meta { display: none; }
.node[data-visual-role="landmark"] .node-name {
  max-width: 116px;
  margin-top: 0;
  font-size: 12px;
  line-height: 1.2;
}
.node[data-visual-role="index-slip"],
.node[data-visual-role="cinnabar-note"] {
  min-height: 42px;
  max-width: 182px;
  padding: 8px 11px 8px 13px;
  border-radius: 8px 12px 12px 8px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  box-shadow: 0 13px 24px rgba(36, 31, 26, .1), inset 0 0 0 1px rgba(255, 255, 255, .32);
}
.llm-wiki-graph-engine[data-theme="mo-ye"] .node[data-visual-role="index-slip"],
.llm-wiki-graph-engine[data-theme="mo-ye"] .node[data-visual-role="cinnabar-note"] {
  background: color-mix(in srgb, var(--surface-2) 88%, transparent);
  box-shadow: 0 16px 30px rgba(0, 0, 0, .38), inset 0 0 0 1px rgba(245, 240, 230, .09);
}
.node[data-visual-role="cinnabar-note"] {
  border-color: color-mix(in srgb, var(--cinnabar) 78%, transparent);
  box-shadow: 0 17px 30px color-mix(in srgb, var(--cinnabar) 18%, transparent), 0 0 0 4px color-mix(in srgb, var(--cinnabar) 11%, transparent);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] {
  --community-map-label-bg: rgba(255, 252, 246, .68);
  --community-map-label-border: rgba(121, 102, 80, .14);
  --community-map-label-shadow: rgba(58, 42, 26, .06);
  background:
    var(--paper-glow),
    var(--bg);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .community-wash {
  fill: rgba(113, 152, 164, .055);
  stroke: rgba(113, 152, 164, .16);
  stroke-width: 1.4;
  stroke-dasharray: 10 8;
  opacity: .68;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"][data-relation-focus="active"] .community-wash {
  opacity: .42;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .edge {
  stroke-width: max(1.1px, min(1.65px, var(--edge-map-width, 1.45px))) !important;
  opacity: .32 !important;
  transition: opacity .18s ease, stroke-width .18s ease, stroke .18s ease;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .edge.relation-implementation {
  stroke: color-mix(in srgb, var(--night) 34%, transparent);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .edge.relation-dependency {
  stroke: color-mix(in srgb, var(--night) 36%, transparent);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .edge.relation-derivation {
  stroke: color-mix(in srgb, var(--night) 34%, transparent);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .edge.relation-contrast {
  stroke: color-mix(in srgb, var(--amber) 40%, transparent);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .edge.relation-conflict {
  stroke: rgba(183, 96, 112, .42); /* conflict 色 token 化待 ADR-23 关系边系统整体演进，spec §3.4 */
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"][data-relation-focus="active"] .edge[data-relation-focus-depth="first"] {
  opacity: .74 !important;
  stroke-width: max(2px, var(--edge-map-width, 2px)) !important;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"][data-relation-focus="active"] .edge[data-relation-focus-depth="second"] {
  opacity: .12 !important;
  stroke-width: 1.15px !important;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"][data-relation-focus="active"] .edge[data-relation-focus-depth="unrelated"] {
  opacity: .018 !important;
  pointer-events: none;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node {
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  max-width: 44px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  box-shadow: none;
  transform: none;
  overflow: visible;
}
.llm-wiki-graph-engine .node-pin,
.llm-wiki-graph-engine .dot-core {
  display: none;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node-pin {
  position: relative;
  display: grid;
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  place-items: center;
  pointer-events: none;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .dot-core {
  display: block;
  width: var(--node-size, 13px);
  height: var(--node-size, 13px);
  border: 1px solid rgba(255, 252, 246, .82);
  border-radius: 999px;
  background: var(--node-community-color, var(--night));
  transition: transform .16s ease, box-shadow .16s ease, background .16s ease, opacity .16s ease;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node[data-type="topic"] .dot-core {
  background: var(--cinnabar);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node:hover .dot-core {
  box-shadow: 0 0 8px 1px color-mix(in srgb, var(--night) 45%, transparent);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node[data-type="topic"]:hover .dot-core {
  box-shadow: 0 0 8px 1px color-mix(in srgb, var(--cinnabar) 45%, transparent);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node[data-type="source"]:hover .dot-core {
  box-shadow: 0 0 8px 1px color-mix(in srgb, var(--jade) 45%, transparent);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node[data-type="synthesis"]:hover .dot-core,
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node[data-type="comparison"]:hover .dot-core {
  box-shadow: 0 0 8px 1px color-mix(in srgb, var(--amber) 45%, transparent);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node[data-type="query"]:hover .dot-core {
  box-shadow: 0 0 8px 1px color-mix(in srgb, var(--violet) 45%, transparent);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node[aria-pressed="true"] .dot-core,
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node[data-relation-focus-depth="focus"] .dot-core {
  transform: scale(1.32);
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--cinnabar) 18%, transparent), 0 8px 18px rgba(58, 42, 26, .16);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"][data-relation-focus="active"] .node[data-relation-focus-depth="first"] .dot-core {
  transform: scale(1.12);
  opacity: .96;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"][data-relation-focus="active"] .node[data-relation-focus-depth="second"] .dot-core {
  opacity: .38;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"][data-relation-focus="active"] .node[data-relation-focus-depth="unrelated"] .dot-core {
  opacity: .16;
  transform: scale(.82);
  box-shadow: none;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node-kind,
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node-meta {
  display: none !important;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node-name {
  position: absolute;
  top: 50%;
  left: calc(50% + 15px);
  z-index: 2;
  display: none !important;
  max-width: 158px;
  margin: 0;
  overflow: hidden;
  border: 1px solid var(--community-map-label-border);
  border-radius: 5px;
  background: var(--community-map-label-bg);
  box-shadow: 0 5px 16px var(--community-map-label-shadow);
  padding: 3px 7px;
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.22;
  text-overflow: ellipsis;
  white-space: nowrap;
  pointer-events: none;
  transform: translateY(-50%);
  backdrop-filter: blur(10px);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node[data-label-side="left"] .node-name {
  right: calc(50% + 15px);
  left: auto;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node[data-label-side="top"] .node-name {
  top: auto;
  bottom: calc(50% + 13px);
  left: 50%;
  transform: translateX(-50%);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node[data-label-side="bottom"] .node-name {
  top: calc(50% + 13px);
  left: 50%;
  transform: translateX(-50%);
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node:not(.is-label-hidden) .node-name,
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node[data-relation-focus-depth="focus"] .node-name,
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node[data-relation-focus-depth="first"][data-relation-label="true"] .node-name {
  display: block !important;
}
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .node[data-filter-state="hidden"],
.llm-wiki-graph-engine[data-community-map-state="lightweight"] .edge[data-filter-state="hidden"],
.llm-wiki-graph-engine[data-community-map-state="lightweight"][data-relation-focus="active"] .edge[data-filter-state="hidden"] {
  opacity: .035 !important;
  pointer-events: none;
}
.llm-wiki-graph-engine[data-theme="mo-ye"][data-community-map-state="lightweight"] .node-name {
  border-color: color-mix(in srgb, var(--line) 34%, transparent);
  background: color-mix(in srgb, var(--surface-2) 88%, transparent);
  box-shadow: 0 10px 22px rgba(0, 0, 0, .28);
}
.node.is-disabled { opacity: .72; }
.node.is-diff-added {
  animation: llm-wiki-node-grow .96s cubic-bezier(.18,.82,.22,1) both;
  animation-delay: var(--diff-delay, 0ms);
}
.node.is-diff-removed {
  animation: llm-wiki-fade-out .72s ease forwards;
}
.node.is-diff-recolored {
  animation: llm-wiki-node-recolor .92s ease both;
}
.mini-map {
  position: absolute;
  right: 16px;
  bottom: 16px;
  z-index: 4;
  width: 160px;
  height: 54px;
  border: 1px solid color-mix(in srgb, var(--rule) 86%, transparent);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--surface) 74%, transparent);
  box-shadow: var(--soft-shadow);
}
.llm-wiki-graph-engine[data-theme="mo-ye"] .mini-map,
.llm-wiki-graph-engine[data-theme="mo-ye"] .graph-reader {
  border-color: color-mix(in srgb, var(--line) 34%, transparent);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  box-shadow: var(--soft-shadow), inset 0 0 0 1px rgba(245, 240, 230, .05);
}
.mini-map svg {
  width: 100%;
  height: 100%;
  display: block;
}
.mini-map .is-selected {
  stroke: var(--cinnabar);
  stroke-width: 1.5;
}
.mini-map-viewport {
  fill: color-mix(in srgb, var(--cinnabar) 7%, transparent);
  stroke: color-mix(in srgb, var(--cinnabar) 78%, transparent);
  stroke-width: 1.2;
  rx: 3;
  pointer-events: none;
}
.graph-reader {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 6;
  display: flex;
  flex-direction: column;
  width: min(360px, calc(100% - 32px));
  max-height: calc(100% - 100px);
  border: 1px solid color-mix(in srgb, var(--rule) 82%, transparent);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  box-shadow: var(--soft-shadow);
  opacity: 0;
  pointer-events: none;
  touch-action: auto;
  user-select: text;
  -webkit-user-select: text;
  transform: translateY(-4px);
  transition: opacity .18s ease, transform .18s ease;
}
.graph-reader[data-state="open"] {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}
.graph-reader-header {
  position: relative;
  padding: 14px 42px 10px 14px;
  border-bottom: 1px solid color-mix(in srgb, var(--rule) 72%, transparent);
}
.graph-reader-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 700;
}
.graph-reader-meta {
  margin-top: 4px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  overflow: hidden;
  color: var(--muted);
  font-size: 11px;
}
.graph-reader-meta span {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.graph-reader-close {
  position: absolute;
  top: 9px;
  right: 10px;
  width: 26px;
  height: 26px;
  border: 1px solid color-mix(in srgb, var(--rule) 78%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  color: var(--ink);
}
.graph-reader-body {
  min-height: 0;
  overflow: auto;
  touch-action: auto;
  user-select: text;
  -webkit-user-select: text;
  padding: 12px 14px 14px;
}
.graph-reader-source {
  display: inline-block;
  max-width: 100%;
  margin-bottom: 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  vertical-align: top;
  white-space: nowrap;
  color: var(--cinnabar);
  font-size: 12px;
}
.graph-reader-body pre {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: var(--font-serif);
  font-size: 13px;
  line-height: 1.65;
}
.graph-reader-empty {
  margin: 0;
  padding: 12px 14px;
  color: var(--muted);
  font-size: 13px;
}
@keyframes llm-wiki-node-grow {
  0% {
    opacity: 0;
    translate: calc(-50% + var(--diff-anchor-dx, 0px)) calc(-50% + var(--diff-anchor-dy, 0px));
    transform: scale(.68);
  }
  100% {
    opacity: 1;
    translate: -50% -50%;
    transform: scale(1);
  }
}
@keyframes llm-wiki-edge-draw {
  to { stroke-dashoffset: 0; }
}
@keyframes llm-wiki-fade-out {
  to { opacity: 0; transform: scale(.82); }
}
@keyframes llm-wiki-node-recolor {
  0% { filter: saturate(.55) brightness(1.18); }
  100% { filter: saturate(1) brightness(1); }
}
@keyframes llm-wiki-community-emerge {
  0% { opacity: 0; transform: scale(.82); }
  100% { transform: scale(1); }
}

      var warningDataEl = document.getElementById("graph-warning-data");
      var layoutEl = document.getElementById("graph-layout");
      var storageAvailable = true;
      function showError(message) {
        if (!root) return;
        root.innerHTML = "";
        if (toolbarHost) toolbarHost.innerHTML = "";
        var storageWarning = document.querySelector(".offline-storage-warning");
        if (storageWarning) storageWarning.remove();
        try {
          if (window.__LLM_WIKI_GRAPH_ENGINE__) window.__LLM_WIKI_GRAPH_ENGINE__.destroy();
        } catch (_) {}
        window.__LLM_WIKI_GRAPH_ENGINE__ = undefined;
        var box = document.createElement("div");
        box.className = "offline-error";
        box.textContent = message;
        root.appendChild(box);
      }
      function showStorageRecoveryHint() {
        if (document.querySelector(".offline-storage-warning")) return;
        var main = document.querySelector(".offline-main");
        if (!main || !root) return;
        var box = document.createElement("div");
        box.className = "offline-error offline-storage-warning";
        box.setAttribute("role", "status");
        box.textContent = "浏览器存储不可用。图谱仍可浏览，但刷新后主题与固定位置会恢复默认。";
        main.insertBefore(box, root);
      }
      function parseJson(el, fallback) {
        try { return el && el.textContent ? JSON.parse(el.textContent) : fallback; }
        catch (err) { return fallback; }
      }
      function safeRelativePath(value) {
        var text = String(value == null ? "" : value);
        if (!text || text.charAt(0) === "/" || text.indexOf("\\") >= 0 || text === ".." || text.indexOf("../") === 0 || text.indexOf("/../") >= 0) {
          return "（路径不可用）";
        }
        return text;
      }
      function appendTextList(parent, values) {
        if (!values.length) return;
        var list = document.createElement("ul");
        for (var i = 0; i < values.length; i++) {
          var item = document.createElement("li");
          item.textContent = values[i];
          list.appendChild(item);
        }
        parent.appendChild(list);
      }
      function renderWarnings(payload, modelWarnings) {
        var banner = document.querySelector("[data-testid='offline-warning-banner']");
        var summaryBox = document.querySelector("[data-testid='offline-warning-summary']");
        var unavailable = document.querySelector("[data-testid='offline-warning-unavailable']");
        var truncated = document.querySelector("[data-testid='offline-warning-truncated']");
        var details = document.querySelector("[data-testid='offline-warning-details']");
        var groupsBox = document.querySelector("[data-testid='offline-warning-groups']");
        if (!banner || !summaryBox || !payload) return;
        var summary = payload.summary || {};
        var warningById = {};
        for (var warningIndex = 0; warningIndex < (modelWarnings || []).length; warningIndex++) {
          var warning = modelWarnings[warningIndex];
          if (warning && warning.warning_id && !warningById[warning.warning_id]) warningById[warning.warning_id] = warning;
        }
        var warnings = Object.keys(warningById).sort().map(function (warningId) { return warningById[warningId]; });
        var hasWarningSummary = typeof summary.total_groups === "number"
          || typeof summary.total_occurrences === "number";
        if (!hasWarningSummary && warnings.length === 0) return;
        if (!hasWarningSummary) {
          summary = { total_groups: warnings.length, total_occurrences: 0, error_occurrences: 0, warning_occurrences: 0, by_code: {} };
          for (var summaryIndex = 0; summaryIndex < warnings.length; summaryIndex++) {
            var summaryWarning = warnings[summaryIndex];
            var count = Number(summaryWarning.occurrence_count || 0);
            summary.total_occurrences += count;
            if (summaryWarning.severity === "error") summary.error_occurrences += count;
            else summary.warning_occurrences += count;
            summary.by_code[summaryWarning.code] = (summary.by_code[summaryWarning.code] || 0) + count;
          }
        }
        var codes = Object.keys(summary.by_code || {}).sort().map(function (code) {
          return code + ": " + summary.by_code[code];
        });
        summaryBox.textContent = "图谱告警 " + (summary.total_groups || 0) + " 组 · "
          + (summary.total_occurrences || 0) + " 处 · 错误 " + (summary.error_occurrences || 0)
          + " · 提示 " + (summary.warning_occurrences || 0)
          + (codes.length ? " · " + codes.join(" · ") : "");
        banner.hidden = false;

        if (payload.details_status !== "available") {
          if (unavailable) {
            unavailable.hidden = false;
            unavailable.textContent = "告警详情暂不可用，请重新构建图谱";
          }
        }
        if (payload.warning_details_truncated && truncated) {
          truncated.hidden = false;
          truncated.textContent = "详情过大，已精简；运行 check 查看完整报告"
            + "（省略 " + (payload.omitted_group_count || 0) + " 组、"
            + (payload.omitted_candidate_set_count || 0) + " 个候选集合）";
        }

        var bundle = payload.bundle || { candidate_sets: [], groups: [] };
        var candidateSets = {};
        for (var setIndex = 0; setIndex < (bundle.candidate_sets || []).length; setIndex++) {
          var candidateSet = bundle.candidate_sets[setIndex];
          candidateSets[candidateSet.candidate_set_id] = candidateSet;
        }
        if (groupsBox) groupsBox.innerHTML = "";
        for (var groupIndex = 0; groupsBox && groupIndex < warnings.length; groupIndex++) {
          var group = warnings[groupIndex];
          var groupBox = document.createElement("section");
          groupBox.className = "offline-warning-group";
          groupBox.setAttribute("data-warning-id", group.warning_id);
          var title = document.createElement("h3");
          title.textContent = group.code + " · " + group.occurrence_count + " 处";
          groupBox.appendChild(title);
          if (group.message) {
            var message = document.createElement("div");
            message.textContent = group.message;
            groupBox.appendChild(message);
          }
          var set = candidateSets[group.candidate_set_id];
          appendTextList(groupBox, set ? (set.candidates || []).map(safeRelativePath) : []);
          appendTextList(groupBox, (group.occurrences || []).map(function (occurrence) {
            return safeRelativePath(occurrence.source_path) + ":" + occurrence.line + ":" + occurrence.column + " " + occurrence.raw_link;
          }));
          groupsBox.appendChild(groupBox);
        }
        if (details) details.hidden = warnings.length === 0;
      }
      function normalizeStorageSegment(value) {
        return String(value == null ? "" : value).trim().toLowerCase()
          .replace(/[^a-z0-9一-鿿]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 48);
      }
      function hashString(value) {
        var input = String(value == null ? "" : value);
        var hash = 0;
        for (var i = 0; i < input.length; i++) {
          hash = ((hash << 5) - hash + input.charCodeAt(i)) >>> 0;
        }
        return hash.toString(36);
      }
      function storageNamespace(meta, pathname) {
        var title = normalizeStorageSegment(meta && meta.wiki_title ? meta.wiki_title : "");
        var basis = typeof pathname === "string" && pathname ? pathname : (meta && meta.wiki_title) || title || "default";
        return "llm-wiki:" + (title || "default") + ":" + hashString(basis);
      }
      function readStoredPins(key) {
        try {
          var raw = window.localStorage && window.localStorage.getItem(key);
          var parsed = raw ? JSON.parse(raw) : null;
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch (_) {
          storageAvailable = false;
          return {};
        }
      }
      function writeStoredPins(key, pins) {
        try {
          if (window.localStorage) window.localStorage.setItem(key, JSON.stringify(pins || {}));
        } catch (_) {
          storageAvailable = false;
          showStorageRecoveryHint();
        }
      }
      function normalizeBakedPins(layout) {
        return window.LlmWikiGraphEngine.normalizeGraphLayoutFile(layout).pins;
      }
      function normalizeStoredPins(rawPins) {
        return window.LlmWikiGraphEngine.normalizeGraphPinMap(rawPins);
      }
      if (!root || !dataEl || !window.LlmWikiGraphEngine || !window.LlmWikiGraphEngine.createGraphEngine || !window.LlmWikiGraphEngine.projectGraphInput) {
        showError("图谱引擎加载失败。请确认 HTML 文件完整生成。");
        return;
      }
      var graphData = parseJson(dataEl, null);
      if (!graphData || !Array.isArray(graphData.nodes) || !Array.isArray(graphData.edges)) {
        showError("图谱数据格式不完整。请重新运行 build-graph-data.sh 与 build-graph-html.sh。");
        return;
      }
      var warningPayload = parseJson(warningDataEl, { details_status: "unavailable", summary: {} });
      var inputWarningGroups = warningPayload.details_status === "available" && warningPayload.bundle
        ? (warningPayload.bundle.groups || [])
        : [];
      var projection = window.LlmWikiGraphEngine.projectGraphInput(graphData, inputWarningGroups);
      graphData = projection.data;
      renderWarnings(warningPayload, projection.warnings || []);
      var bakedLayout = parseJson(layoutEl, { pins: {} });
      var key = storageNamespace(graphData.meta || {}, window.location && window.location.pathname) + ":graph-pins";
      var themeKey = storageNamespace(graphData.meta || {}, window.location && window.location.pathname) + ":graph-theme";
      var pins = Object.assign({}, normalizeBakedPins(bakedLayout), normalizeStoredPins(readStoredPins(key)));
      var themeToggle = document.querySelector("[data-testid='offline-theme-toggle']");
      function readStoredTheme() {
        try {
          var value = window.localStorage && window.localStorage.getItem(themeKey);
          return value === "mo-ye" ? "mo-ye" : "shan-shui";
        } catch (_) {
          storageAvailable = false;
          return "shan-shui";
        }
      }
      function writeStoredTheme(theme) {
        try {
          if (window.localStorage) window.localStorage.setItem(themeKey, theme);
        } catch (_) {
          storageAvailable = false;
          showStorageRecoveryHint();
        }
      }
      function syncThemeToggle(theme) {
        if (!themeToggle) return;
        var next = theme === "mo-ye" ? "shan-shui" : "mo-ye";
        themeToggle.textContent = theme === "mo-ye" ? "山水" : "墨夜";
        themeToggle.setAttribute("aria-label", next === "mo-ye" ? "切换墨夜主题" : "切换山水主题");
      }
      var currentTheme = readStoredTheme();
      var engine = null;
      try {
        engine = window.LlmWikiGraphEngine.createGraphEngine(root, {
          data: graphData,
          pins: pins,
          theme: currentTheme,
          toolbarContainer: toolbarHost,
          capabilities: window.LlmWikiGraphEngine.createGraphOfflineCapabilities({
            persistPins: function (nextPins) {
              writeStoredPins(key, nextPins || {});
              return Promise.resolve();
            }
          }).capabilities
        });
        syncThemeToggle(currentTheme);
        if (themeToggle) {
          themeToggle.addEventListener("click", function () {
            currentTheme = currentTheme === "mo-ye" ? "shan-shui" : "mo-ye";
            engine.setTheme(currentTheme);
            writeStoredTheme(currentTheme);
            syncThemeToggle(currentTheme);
          });
        }
        window.__LLM_WIKI_GRAPH_ENGINE__ = engine;
        window.__LLM_WIKI_GRAPH_PINS_KEY__ = key;
        window.__LLM_WIKI_GRAPH_THEME_KEY__ = themeKey;
        if (!storageAvailable) showStorageRecoveryHint();
      } catch (_) {
        try { if (engine) engine.destroy(); } catch (_) {}
        showError("图谱引擎加载失败。请确认 HTML 文件完整生成。");
        return;
      }
    })();
  </script>
</body>
</html>
