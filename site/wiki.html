<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>已发布 · Operit-wiki</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="topbar">
  <div class="inner">
    <div class="brand"><span class="seal-mini">審</span>Operit-wiki</div>
    <nav>
      <a href="index.html">评审大厅</a>
      <a href="wiki.html" class="active">已发布</a>
      <a href="https://github.com/luojiaping/Operit-wiki" target="_blank">GitHub</a>
    </nav>
  </div>
</div>

<div class="layout">
  <div class="hero">
    <h1>已发布的 wiki</h1>
    <div class="rule"><span>正編</span></div>
    <p>通过评审、正式合并的条目。QQ 群官方答疑机器人从这里取知识——文档与答疑是同一份源头。</p>
  </div>
  <div class="paper-card">
    <div class="markdown-body" id="content"></div>
  </div>
  <div class="credit">纸墨设计参考 <a href="https://github.com/sdyckjq-lab/llm-wiki-skill" target="_blank">sdyckjq-lab/llm-wiki-skill</a>（MIT）</div>
</div>

<script>
fetch("data/wiki/index.md")
  .then(r => r.text())
  .then(t => { document.getElementById("content").innerHTML = marked.parse(t); })
  .catch(() => { document.getElementById("content").innerHTML = `<div class="empty">尚无已发布条目。</div>`; });
</script>
</body>
</html>
