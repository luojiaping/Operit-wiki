<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operit-wiki · 条目评审</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <div class="inner">
    <div class="brand"><span class="seal-mini">審</span>Operit-wiki</div>
    <nav>
      <a href="index.html" class="active">评审大厅</a>
      <a href="wiki.html">Wiki 预览</a>
      <a href="graph.html">知识图谱</a>
      <a href="quality.html">代码走查</a>
      <a href="https://github.com/luojiaping/Operit-wiki" target="_blank">GitHub</a>
    </nav>
  </div>
</div>

<div class="layout">
  <div class="hero">
    <h1>条目评审大厅</h1>
    <div class="rule"><span>審閱</span></div>
    <p>AI 生成的 wiki 条目在此接受评审。点进条目细读，在评论区留下评审意见——结论三选一：通过 / 需修改 / 打回重写。</p>
  </div>

  <div class="stats" id="stats"></div>
  <div class="filters" id="filters"></div>
  <div class="entry-cards" id="list"></div>
  <div class="updated" id="updated"></div>

  <div class="coverage" id="coverage">
    <h2>Wiki 覆盖进度 <span class="cov-updated" id="covUpdated"></span></h2>
    <p class="cov-desc">全仓库文件逐个对照 wiki 覆盖情况：已读 = 被某条目 facts 引用或列为 seed；已审批 = 归属已通过条目。目标：88 万行无死角。</p>
    <div class="cov-bars" id="covBars"></div>
    <div class="cov-mods" id="covMods"></div>
    <div class="cov-tools">
      <input id="covSearch" class="cov-search" placeholder="搜索文件路径…">
      <div class="cov-chips" id="covStatusChips"></div>
      <select id="covModSel" class="cov-sel"></select>
      <label class="cov-kt"><input type="checkbox" id="covKt"> 仅 kt</label>
    </div>
    <div class="cov-count" id="covCount"></div>
    <table class="cov-table">
      <thead><tr><th>状态</th><th>文件</th><th>模块</th><th>行数</th><th>覆盖条目</th></tr></thead>
      <tbody id="covBody"></tbody>
    </table>
  </div>

  <div class="credit">纸墨设计参考 <a href="https://github.com/sdyckjq-lab/llm-wiki-skill" target="_blank">sdyckjq-lab/llm-wiki-skill</a>（MIT）</div>
</div>

<script>
const STATUS_LABEL = { "review-pending": "待评审", "needs-changes": "需修改", "approved": "已通过" };
let entries = [], activeFilter = "all";

async function load() {
  const q = await (await fetch("data/review-queue.json")).json();
  entries = q.entries || [];
  document.getElementById("updated").textContent = "队列更新时间：" + (q.updated || "—");
  renderStats(); renderFilters(); renderList();
}
function renderStats() {
  const c = { "review-pending": 0, "needs-changes": 0, "approved": 0 };
  entries.forEach(e => { if (c[e.status] !== undefined) c[e.status]++; });
  document.getElementById("stats").innerHTML =
    `<div class="stat pending"><div class="n">${c["review-pending"]}</div><div class="l">待评审</div></div>` +
    `<div class="stat changes"><div class="n">${c["needs-changes"]}</div><div class="l">需修改</div></div>` +
    `<div class="stat done"><div class="n">${c["approved"]}</div><div class="l">已通过</div></div>`;
}
function renderFilters() {
  const defs = [["all","全部"],["review-pending","待评审"],["needs-changes","需修改"],["approved","已通过"]];
  document.getElementById("filters").innerHTML = defs.map(([v,l]) =>
    `<button class="chip ${v===activeFilter?"active":""}" data-f="${v}">${l}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b =>
    b.onclick = () => { activeFilter = b.dataset.f; renderFilters(); renderList(); });
}
function renderList() {
  const box = document.getElementById("list");
  const items = entries.filter(e => activeFilter==="all" || e.status===activeFilter);
  if (!items.length) {
    box.innerHTML = `<div class="empty">暂无条目。<br>新条目生成后会自动出现在这里。</div>`;
    return;
  }
  box.innerHTML = items.map(e => `
    <a class="entry-card" href="entry.html?id=${encodeURIComponent(e.id)}">
      <span class="seal ${e.status}">${STATUS_LABEL[e.status]||e.status}</span>
      <div class="t">${e.title}</div>
      ${e.summary ? `<div class="d">${e.summary}</div>` : ""}
      <div class="meta">
        <span>模块 ${e.module||"—"}</span><span>批次 ${e.batch}</span>
        <span>facts ${e.facts_count||0}</span>
        ${e.refs_valid?`<span>引用 ${e.refs_valid}</span>`:""}
        ${e.critic?`<span>critic ${e.critic}</span>`:""}
      </div>
    </a>`).join("");
}
load();
loadCoverage();

/* ---- Wiki 覆盖进度 ---- */
const COV_LABEL = ["未读", "已读", "已审批"];
let covData = null, covStatus = "all", covMod = "all";
async function loadCoverage() {
  try {
    covData = await (await fetch("data/coverage.json")).json();
  } catch (e) { return; }
  document.getElementById("covUpdated").textContent = "· 数据更新 " + (covData.updated || "—");
  renderCovBars(); renderCovMods(); renderCovTools(); renderCovTable();
}
function pct(a, b) { return b ? (100 * a / b) : 0; }
function renderCovBars() {
  const t = covData.totals;
  const rows = [
    ["已读", t.read_files, t.files, t.read_loc, t.loc, "read"],
    ["已审批", t.approved_files, t.files, t.approved_loc, t.loc, "approved"],
  ];
  document.getElementById("covBars").innerHTML = rows.map(([l, rf, f, rl, tl, cls]) => `
    <div class="cov-bar-row">
      <div class="cov-bar-label">${l} <b>${rf}</b>/${f} 文件 · ${rl.toLocaleString()}/${tl.toLocaleString()} 行</div>
      <div class="cov-bar"><div class="cov-fill ${cls}" style="width:${pct(rf, f).toFixed(2)}%"></div></div>
      <div class="cov-pct">${pct(rf, f).toFixed(1)}%</div>
    </div>`).join("");
}
function renderCovMods() {
  document.getElementById("covMods").innerHTML = covData.modules.map(m => `
    <div class="cov-mod">
      <div class="cov-mod-name">${m.name}<span>${m.dir}</span></div>
      <div class="cov-bar slim"><div class="cov-fill read" style="width:${pct(m.read_files, m.files).toFixed(2)}%"></div></div>
      <div class="cov-mod-nums">已读 ${m.read_files}/${m.files} · 已审批 ${m.approved_files}</div>
    </div>`).join("");
}
function renderCovTools() {
  const defs = [["all", "全部"], ["0", "未读"], ["1", "已读"], ["2", "已审批"]];
  document.getElementById("covStatusChips").innerHTML = defs.map(([v, l]) =>
    `<button class="chip ${v === covStatus ? "active" : ""}" data-s="${v}">${l}</button>`).join("");
  document.querySelectorAll("#covStatusChips .chip").forEach(b =>
    b.onclick = () => { covStatus = b.dataset.s; renderCovTools(); renderCovTable(); });
  const sel = document.getElementById("covModSel");
  sel.innerHTML = `<option value="all">全部模块</option>` + covData.modules.map(m =>
    `<option value="${m.name}" ${m.name === covMod ? "selected" : ""}>${m.name} (${m.files})</option>`).join("");
  sel.onchange = () => { covMod = sel.value; renderCovTable(); };
  document.getElementById("covSearch").oninput = renderCovTable;
  document.getElementById("covKt").onchange = renderCovTable;
}
function covFiltered() {
  const q = document.getElementById("covSearch").value.trim().toLowerCase();
  const ktOnly = document.getElementById("covKt").checked;
  return covData.files.filter(f =>
    (covStatus === "all" || String(f.s) === covStatus) &&
    (covMod === "all" || f.m === covMod) &&
    (!ktOnly || f.kt) &&
    (!q || f.p.toLowerCase().includes(q)));
}
function renderCovTable() {
  const rows = covFiltered();
  const LIMIT = 400;
  document.getElementById("covCount").textContent =
    `共 ${rows.length} 个文件${rows.length > LIMIT ? `，显示前 ${LIMIT} 个，请用搜索 / 筛选缩小范围` : ""}`;
  document.getElementById("covBody").innerHTML = rows.slice(0, LIMIT).map(f => `
    <tr>
      <td><span class="seal cov-s${f.s}">${COV_LABEL[f.s]}</span></td>
      <td class="mono">${f.p}</td>
      <td>${f.m}</td>
      <td class="num">${f.loc.toLocaleString()}</td>
      <td>${f.page ? `<a href="entry.html?id=${encodeURIComponent(f.page)}">${f.page}</a>` : "—"}</td>
    </tr>`).join("");
}
</script>
</body>
</html>
