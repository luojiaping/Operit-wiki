<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识图谱 · Operit-wiki</title>
<link rel="stylesheet" href="style.css?v=c8a1c93">
<style>
  .graph-wrap { padding: 0; overflow: hidden; }
  .graph-wrap iframe { display: block; width: 100%; height: calc(100vh - 260px); min-height: 560px; border: 0; background: #0a0e14; }
  .graph-meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--app-muted); margin-top: 8px; }
  .graph-meta b { color: var(--app-fg); }
  .open-new { font-size: 13px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="inner">
    <div class="brand"><img class="logo-mark" src="logo.svg" alt="Operit">Operit-wiki</div>
    <nav>
      <a href="index.html">首页</a>
      <a href="wiki.html">Wiki</a>
      <a href="graph.html" class="active">知识图谱</a>
      <a href="quality.html">代码走查</a>
      <a href="tutorials.html">教程分享</a>
      <a href="https://github.com/luojiaping/Operit-wiki" target="_blank">GitHub</a>
    </nav>
  </div>
</div>

<div class="layout">
  <div class="hero">
    <h1>知识图谱</h1>
    <div class="rule"><span>觀象</span></div>
    <p>24 个规划条目与 9 个代码模块的关联全景：节点为条目/模块，边按置信度标注（EXTRACTED 来自确定性统计，INFERRED 来自大纲语义关联）。</p>
    <div class="graph-meta" id="graph-meta"></div>
    <p class="open-new"><a href="data/graph/knowledge-graph.html" target="_blank">在新窗口打开图谱 ↗</a></p>
  </div>
  <div class="paper-card graph-wrap">
    <iframe src="data/graph/knowledge-graph.html" title="Operit-wiki 知识图谱" loading="lazy"></iframe>
  </div>
  <div class="credit">图谱前端引擎来自 <a href="https://github.com/sdyckjq-lab/llm-wiki-skill" target="_blank">sdyckjq-lab/llm-wiki-skill</a>（MIT）；纸墨外框为本站设计</div>
</div>

<script>
fetch("data/graph/graph-meta.json")
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(m => {
    document.getElementById("graph-meta").innerHTML =
      `节点 <b>${m.nodes}</b> · 边 <b>${m.edges}</b> · 构建 <b>${m.built}</b><br>数据来源：<b>${m.source}</b>`;
  })
  .catch(() => {});
</script>
</body>
</html>
