<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki 预览 · Operit-wiki</title>
<link rel="stylesheet" href="style.css?v=aabbb6f">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  .tree-chapter { margin: 14px 0 4px; font-size: 13px; font-weight: 700; color: var(--app-fg); }
  .tree-chapter:first-child { margin-top: 0; }
  .tree-page { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: 1px solid transparent; border-radius: 8px;
    padding: 7px 10px; font-size: 14px; cursor: pointer; color: var(--app-fg); }
  .tree-page:hover { background: var(--app-raised); }
  .tree-page.active { background: var(--app-raised); border-color: var(--app-border); }
  .tree-page .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.published { background: var(--app-accent-deep); }
  .dot.review { background: var(--app-amber); }
  .dot.planned { background: var(--app-muted); opacity: .5; }
  .page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .page-head h2 { margin: 0; font-size: 22px; }
  .kv { font-size: 13px; color: var(--app-muted); margin: 4px 0; }
  .kv b { color: var(--app-fg); font-weight: 600; }
  .status-line { font-size: 13px; color: var(--app-muted); margin: 10px 0 0; }
</style>
</head>
<body>
<div class="topbar">
  <div class="inner">
    <div class="brand"><img class="logo-mark" src="logo.svg" alt="Operit">Operit-wiki</div>
    <nav>
      <a href="index.html">首页</a>
      <a href="wiki.html" class="active">Wiki 预览</a>
      <a href="graph.html">知识图谱</a>
      <a href="quality.html">代码走查</a>
      <a href="tutorials.html">教程分享</a>
      <a href="https://github.com/luojiaping/Operit-wiki" target="_blank">GitHub</a>
    </nav>
  </div>
</div>

<div class="layout cols">
  <aside class="rail-left">
    <div class="paper-card">
      <h3 style="margin-top:0">目录</h3>
      <div class="status-line" id="counts"></div>
      <div id="tree"></div>
    </div>
  </aside>

  <main>
    <div class="paper-card">
      <div class="page-head">
        <h2 id="page-title">载入中…</h2>
        <span class="seal" id="page-seal"></span>
      </div>
      <div class="kv" id="page-meta"></div>
      <div class="rule"><span>正文</span></div>
      <div class="markdown-body" id="page-body"></div>
    </div>
    <div class="credit">纸墨设计参考 <a href="https://github.com/sdyckjq-lab/llm-wiki-skill" target="_blank">sdyckjq-lab/llm-wiki-skill</a>（MIT）</div>
  </main>

  <aside class="rail-right">
    <div class="paper-card">
      <h3 style="margin-top:0">凡例</h3>
      <div class="kv"><span class="dot published" style="display:inline-block"></span> <b>已发布</b> — 通过评审并合并</div>
      <div class="kv"><span class="dot review" style="display:inline-block"></span> <b>评审中</b> — 正在走评审流程</div>
      <div class="kv"><span class="dot planned" style="display:inline-block"></span> <b>规划中</b> — 大纲占位，正文未生成</div>
      <div class="rule"><span>说明</span></div>
      <p style="font-size:13px;color:var(--app-muted)">规划中条目只展示大纲里的确定性字段（覆盖问题、种子文件），不写推测正文。条目间关联可去<a href="graph.html">知识图谱</a>
      <a href="quality.html">代码走查</a>
      <a href="tutorials.html">教程分享</a>查看。</p>
    </div>
  </aside>
</div>

<script>
const SEAL = { published: ["approved", "已发布"], review: ["review-pending", "评审中"], planned: ["planned", "规划中"] };
let DATA = null;

function select(id, push = true) {
  for (const ch of DATA.chapters) for (const p of ch.pages) {
    if (p.id === id) { renderPage(p, ch.chapter); break; }
  }
  document.querySelectorAll(".tree-page").forEach(b => b.classList.toggle("active", b.dataset.id === id));
  if (push) history.replaceState(null, "", "wiki.html?id=" + encodeURIComponent(id));
}

function renderPage(p, chapter) {
  document.title = p.title + " · Operit-wiki";
  document.getElementById("page-title").textContent = p.title;
  const [cls, label] = SEAL[p.status];
  const seal = document.getElementById("page-seal");
  seal.className = "seal " + cls; seal.textContent = label;
  document.getElementById("page-meta").innerHTML =
    `章节 <b>${chapter}</b> · 模块 <b>${p.module}</b>`;
  document.getElementById("page-body").innerHTML = marked.parse(p.md);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

fetch("data/wiki/pages.json")
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(d => {
    DATA = d;
    const c = d.counts;
    document.getElementById("counts").textContent =
      `已发布 ${c.published} · 评审中 ${c.review} · 规划中 ${c.planned}`;
    const tree = document.getElementById("tree");
    let first = null;
    for (const ch of d.chapters) {
      const h = document.createElement("div");
      h.className = "tree-chapter"; h.textContent = ch.chapter;
      tree.appendChild(h);
      for (const p of ch.pages) {
        if (!first) first = p.id;
        const b = document.createElement("button");
        b.className = "tree-page"; b.dataset.id = p.id;
        b.innerHTML = `<span class="dot ${p.status}"></span><span></span>`;
        b.lastChild.textContent = p.title;
        b.onclick = () => select(p.id);
        tree.appendChild(b);
      }
    }
    const want = new URLSearchParams(location.search).get("id");
    const exists = d.chapters.some(ch => ch.pages.some(p => p.id === want));
    select(exists ? want : first, false);
  })
  .catch(() => {
    document.getElementById("page-title").textContent = "数据未生成";
    document.getElementById("page-body").innerHTML = `<div class="empty">pages.json 缺失，请重新部署。</div>`;
  });
</script>
</body>
</html>
