name: Deploy review site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site data
        run: |
          mkdir -p site/data
          if [ -f review-queue.json ]; then
            cp review-queue.json site/data/review-queue.json
          else
            echo '{"updated":"","entries":[]}' > site/data/review-queue.json
          fi
          rm -rf site/data/review site/data/wiki
          [ -d review ] && cp -r review site/data/review || true
          [ -d wiki ] && cp -r wiki site/data/wiki || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
